# Render Blueprint: hosts the Onboarding Assistant app with its backend
# (mobile OTP, human handoff, translation proxy). Deploy with the button in
# app/README.md, or Render > New > Blueprint > pick this repo.
# OTP and handoff run in sandbox mode with no keys. To understand typed questions
# in the 4 languages without built-in translations, add ANTHROPIC_API_KEY later
# under the service's Environment settings.
services:
  - type: web
    name: conversational-onboarding
    runtime: node
    plan: free
    rootDir: app
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://chitrasangatwani-eng.github.io
      - key: DAILY_CALL_LIMIT
        value: "2000"
      - key: PER_IP_LIMIT
        value: "120"
      - key: NODE_VERSION
        value: "22"
      # Mobile OTP integration. sandbox shows the code in the app and sends no SMS.
      # For real SMS set OTP_PROVIDER to msg91 or twilio and add that provider's keys
      # (see app/server/otp/providers.ts).
      - key: VITE_BACKEND
        value: server
      - key: OTP_PROVIDER
        value: sandbox
      - key: OTP_SECRET
        generateValue: true
      # Human handoff. sandbox keeps tickets on the server. Set to slack with
      # HANDOFF_SLACK_WEBHOOK_URL, or webhook with HANDOFF_WEBHOOK_URL (and
      # optionally HANDOFF_WEBHOOK_SECRET), to reach a real team.
      - key: HANDOFF_PROVIDER
        value: sandbox
      # DigiLocker fetch. sandbox shows a DigiLocker-style consent page with sample
      # data. For the real DigiLocker set digilocker plus DIGILOCKER_CLIENT_ID,
      # DIGILOCKER_CLIENT_SECRET and DIGILOCKER_REDIRECT_URI (see app/server/digilocker).
      - key: DIGILOCKER_PROVIDER
        value: sandbox
