# Render Blueprint: hosts the Onboarding Assistant app with its backend
# (mobile OTP, human handoff, translation proxy). Deploy with the button in
# app/README.md, or Render > New > Blueprint > pick this repo.
# OTP and handoff run in sandbox mode with no keys. To understand typed questions
# in the 4 languages without built-in translations, add ANTHROPIC_API_KEY later
# under the service's Environment settings.
services:
  - type: web
    name: conversational-onboarding
    runtime: node
    plan: free
    rootDir: app
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://chitrasangatwani-eng.github.io
      - key: DAILY_CALL_LIMIT
        value: "2000"
      - key: PER_IP_LIMIT
        value: "120"
      # DigiLocker through Setu: DIGILOCKER_PROVIDER=setu, SETU_CLIENT_ID, SETU_CLIENT_SECRET (secret),
      # SETU_PRODUCT_INSTANCE_ID, optional SETU_DIGILOCKER_BASE_URL (default the Setu sandbox).
      # Business details shown on the site (footer and /about) for Meta business
      # verification: BUSINESS_NAME, BUSINESS_EMAIL, BUSINESS_LOCATION,
      # BUSINESS_REGISTRATION, META_DOMAIN_VERIFICATION (see app/server/business.ts).
      # OTP on WhatsApp (no DLT): SMS_PROVIDER=whatsapp, WHATSAPP_TOKEN (secret),
      # WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_TEMPLATE, WHATSAPP_TEMPLATE_LANG (see app/README.md).
      # SMS OTP for +91 numbers through Firebase Phone Auth: add SMS_PROVIDER=firebase,
      # FIREBASE_PROJECT_ID, FIREBASE_API_KEY and FIREBASE_APP_ID in Environment
      # (see app/README.md). Real SMS needs Firebase's Blaze plan.
      # AI answers in the help assistant: add GROQ_API_KEY in the service's
      # Environment settings (it is not stored here). Optional GROQ_MODEL.
      - key: NODE_VERSION
        value: "22"
      # Mobile OTP integration. sandbox shows the code in the app and sends no SMS.
      # Real delivery: msg91 or twilio (SMS, needs DLT in India), or smtp / resend
      # to email the code (no business registration needed). For Gmail set
      # OTP_PROVIDER=smtp, SMTP_USER=you@gmail.com, SMTP_PASS=<Gmail app password>.
      # See app/server/otp/providers.ts.
      - key: VITE_BACKEND
        value: server
      - key: OTP_PROVIDER
        value: sandbox
      - key: OTP_SECRET
        generateValue: true
      # Human handoff. sandbox keeps tickets on the server. Set to slack with
      # HANDOFF_SLACK_WEBHOOK_URL, or webhook with HANDOFF_WEBHOOK_URL (and
      # optionally HANDOFF_WEBHOOK_SECRET), to reach a real team.
      - key: HANDOFF_PROVIDER
        value: sandbox
      # DigiLocker fetch. sandbox shows a DigiLocker-style consent page with sample
      # data. For the real DigiLocker set digilocker plus DIGILOCKER_CLIENT_ID,
      # DIGILOCKER_CLIENT_SECRET and DIGILOCKER_REDIRECT_URI (see app/server/digilocker).
      - key: DIGILOCKER_PROVIDER
        value: sandbox
      # Aadhaar OTP. sandbox shows the OTP in the app with sample data. A real
      # connector for your licensed KYC provider is added in app/server/aadhaar.
      - key: AADHAAR_PROVIDER
        value: sandbox
